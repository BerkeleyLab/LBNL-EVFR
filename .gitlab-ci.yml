stages:
  - prepare
  - gateware
  - software

default:
  tags:
    - xilinx

variables:
  XILINX_VIVADO: /non-free/Xilinx/Vivado_and_Vitis/2020.2.2/Vivado/2020.2
  XILINX_VITIS: /non-free/Xilinx/Vivado_and_Vitis/2020.2.2/Vitis/2020.2
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  GIT_SUBMODULE_STRATEGY: normal

# Gateware jobs
# Gitlab doesn't seem to suport the usage of variables in
# a "dependencies" or "needs" statement. So, unroll the job
# description, as to simplify job descriptions
gw_marble:
  before_script:
    - cd gateware/syn/${APP}_marble && ls /non-free
  stage: gateware
  script:
    - make clean && PATH=$XILINX_VIVADO/bin:$PATH make VARIANT=${VARIANT} ${APP}_marble_top.bit && PATH=$XILINX_VIVADO/bin:$PATH make ${APP}_marble_top.mmi
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 7 days
    paths:
      - gateware/syn/${APP}_marble/${APP}_marble_top.bit
      - gateware/syn/${APP}_marble/${APP}_marble_top.mmi
      - gateware/syn/${APP}_marble/_xilinx/${APP}_marble_top/*.runs/impl_1/*.rpt
      - gateware/syn/${APP}_marble/bd.xsa
  parallel:
    matrix:
      - APP: [evfr, kd]
        VARIANT: ""
      - APP: "kd"
        VARIANT: "USE_KICKER_DRIVER_FMC_SINGLE_ENDED"

# Software jobs
# Gitlab doesn't seem to suport the usage of variables in
# a "dependencies" or "needs" statement. So, unroll the job
# description...
sw_evfr_marble:
  before_script:
    - cd software/app/evfr
  stage: software
  script:
    - make APP=evfr PLATFORM=marble clean && PATH=$XILINX_VITIS/bin:$XILINX_VITIS/gnu/microblaze/lin/bin:$PATH make APP=evfr PLATFORM=marble all
  # Get artifacts from this job, needed to compile the sofware
  needs:
    - job: gw_marble
      parallel:
        matrix:
          - APP: evfr
            VARIANT: ""
      artifacts: true
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 7 days
    paths:
      - software/app/evfr/evfr_marble.elf
      - software/app/evfr/evfr_marble.elf.size
      - software/app/evfr/evfr_marble*.bit

sw_kd_marble:
  before_script:
    - cd software/app/kd
  stage: software
  script:
    - make APP=kd PLATFORM=marble clean && PATH=$XILINX_VITIS/bin:$XILINX_VITIS/gnu/microblaze/lin/bin:$PATH make APP=kd PLATFORM=marble all
  # Get artifacts from this job, needed to compile the sofware
  needs:
    - job: gw_marble
      parallel:
        matrix:
          - APP: kd
            VARIANT: ""
      artifacts: true
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 7 days
    paths:
      - software/app/kd/kd_marble.elf
      - software/app/kd/kd_marble.elf.size
      - software/app/kd/kd_marble*.bit

sw_kd_se_marble:
  before_script:
    - cd software/app/kd
  stage: software
  script:
    - make APP=kd PLATFORM=marble clean && PATH=$XILINX_VITIS/bin:$XILINX_VITIS/gnu/microblaze/lin/bin:$PATH make APP=kd PLATFORM=marble all
  # Get artifacts from this job, needed to compile the sofware
  needs:
    - job: gw_marble
      parallel:
        matrix:
          - APP: kd
            VARIANT: "USE_KICKER_DRIVER_FMC_SINGLE_ENDED"
      artifacts: true
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 7 days
    paths:
      - software/app/kd/kd_marble.elf
      - software/app/kd/kd_marble.elf.size
      - software/app/kd/kd_marble*.bit
